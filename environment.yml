name: music_operations
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - watchdog>=3.0.0
  # dev / test
  - pytest>=7.4.3
  - pytest-cov>=4.1.0
  - black>=24.3.0
  - flake8>=7.0.0
  - flake8-bugbear>=24.0.0
  - bandit>=1.7.8
  - pre-commit>=3.7.0
  # install the package itself in editable mode so the console script is registered
  - pip
  - pip:
    - -e .
