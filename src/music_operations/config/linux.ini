[host]
# AnthemScore ships for Linux x86_64 only; on arm64 the operation is reported unavailable.
anthem_cli_path = /opt/AnthemScore/AnthemScore
destination_directory = ~/Music/AnthemScore
[analysis]
# note all outputs use the  --musicxml and --asdt options in the destination_directory
anthem_cli_options = --headless

[pedal]
music_directory_globs = ~/Music/**/*.wav
